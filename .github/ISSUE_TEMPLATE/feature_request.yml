name: Feature request
description: Propose a concrete parsing or integration use case.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to build, and what is currently difficult?
    validations:
      required: true
  - type: textarea
    id: grammar
    attributes:
      label: Example inputs and expected interpretation
      description: Include accepted and rejected examples. Could existing inputs change meaning?
    validations:
      required: true
