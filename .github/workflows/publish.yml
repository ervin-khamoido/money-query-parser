name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Tag must match package.json');"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: npm publish --access public --provenance
