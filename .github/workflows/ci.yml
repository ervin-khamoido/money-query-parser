name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: npm run demo
      - name: Compare with the published 0.1.0 baseline
        if: matrix.node == 24
        run: |
          npm pack money-query-parser@0.1.0 --registry=https://registry.npmjs.org --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm run check:compatibility -- "$RUNNER_TEMP/money-query-parser-0.1.0.tgz"
      - run: npm run build:site
